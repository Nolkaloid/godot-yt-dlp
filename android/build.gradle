plugins {
    id 'com.android.library' version '8.9.2'
}

android {
    namespace 'org.godotengine.ytdlp'
    compileSdk 35

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['../src/bridge', '../src/plugin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly "org.godotengine:godot:${godotVersion}"
    implementation "io.github.junkfood02.youtubedl-android:library:${youtubedlVersion}"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:${youtubedlVersion}"
}

tasks.register('copyAars', Copy) {
    dependsOn 'assembleDebug', 'assembleRelease'
    from(layout.buildDirectory.dir('outputs/aar')) {
        include 'godot-ytdlp-android-debug.aar', 'godot-ytdlp-android-release.aar'
    }
    into '../bin'
}
